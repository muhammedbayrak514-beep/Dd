name: Forge Edit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          set -e
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -iname 'forge_edit*.zip' | head -1)
          echo "ZIP=$ZIP"
          unzip -q "$ZIP" -d project
          FILE=$(find project -name pubspec.yaml -print -quit)
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: Build APK
        run: cd "$PROJECT_DIR" && flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Forge-Edit-APK
          path: "**/build/app/outputs/flutter-apk/*.apk"
