name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Unzip source + Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e
          echo "Repo root:"
          ls -la

          # Prefer known names, else first .zip in root
          ZIP=""
          for name in forge_edit_for_actions.zip ForgeEdit_TAM_PROJE.zip forge_edit_github.zip forge_edit_fixed.zip; do
            if [ -f "$name" ]; then
              ZIP="$name"
              break
            fi
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1 | sed 's|^\./||')
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Repo kökünde .zip yok. forge_edit_for_actions.zip yükle."
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          mkdir -p project_src
          unzip -q -o "$ZIP" -d project_src

          echo "Extracted tree (top):"
          ls -la project_src

          # If zip had a single top folder (e.g. ForgeEdit/), use it
          if [ -f project_src/pubspec.yaml ]; then
            echo "PROJECT_DIR=project_src" >> "$GITHUB_ENV"
          elif [ -f project_src/ForgeEdit/pubspec.yaml ]; then
            echo "PROJECT_DIR=project_src/ForgeEdit" >> "$GITHUB_ENV"
          else
            # first subdirectory that contains pubspec.yaml
            FOUND=$(find project_src -maxdepth 3 -name pubspec.yaml | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::ZIP içinde pubspec.yaml yok"
              find project_src -maxdepth 3 | head -50
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi
          echo "Project dir will be used after env load"

      - name: Show project dir
        run: |
          set -e
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -d "$PROJECT_DIR/android"
          test -d "$PROJECT_DIR/lib"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: List APK outputs
        working-directory: ${{ env.PROJECT_DIR }}
        run: find build/app/outputs/flutter-apk -type f -name '*.apk' -ls || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
