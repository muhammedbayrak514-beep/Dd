
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          for name in forge_edit_for_actions.zip ForgeEdit_TAM_PROJE.zip forge_edit_github.zip forge_edit_fixed.zip; do
            if [ -f "$name" ]; then
              ZIP="$name"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Repository root does not contain a project ZIP."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          mkdir -p project_src
          unzip -q -o "$ZIP" -d project_src

          if [ -f project_src/pubspec.yaml ]; then
            PROJECT_DIR="project_src"
          else
            FOUND="$(find project_src -maxdepth 4 -type f -name pubspec.yaml -print -quit)"
            if [ -z "$FOUND" ]; then
              echo "::error::pubspec.yaml not found inside ZIP."
              find project_src -maxdepth 3 -print
              exit 1
            fi
            PROJECT_DIR="$(dirname "$FOUND")"
          fi

          if [ ! -d "$PROJECT_DIR/android" ] || [ ! -d "$PROJECT_DIR/lib" ]; then
            echo "::error::Flutter project structure is incomplete."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install and verify Android NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -executable -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt of 3"

            rm -rf \
              "$NDK_DIR" \
              "$SDK_ROOT/.downloadIntermediates" \
              "$SDK_ROOT/.temp" \
              "$HOME/.android/cache"

            if "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              if [ -f "$NDK_DIR/source.properties" ] && \
                 grep -Fq "Pkg.Revision = $NDK_VERSION" "$NDK_DIR/source.properties"; then
                echo "NDK installed and verified."
                exit 0
              fi
              echo "::warning::NDK verification failed."
            else
              echo "::warning::NDK installation failed."
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 8
            fi
          done

          echo "::error::NDK installation failed after 3 attempts."
          exit 1

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print
          compgen -G "$APK_DIR/*.apk" >/dev/null || {
            echo "::error::No APK was generated."
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
