
name: Forge Edit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q forge_edit_stage9_final.zip -d project
          FILE=$(find project -name pubspec.yaml -print -quit)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && flutter pub get

      - name: Analyze
        run: cd "$PROJECT_DIR" && flutter analyze

      - name: Build APK
        run: cd "$PROJECT_DIR" && flutter build apk --debug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Forge-Edit-APK
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            project/**/build/app/outputs/flutter-apk/*.apk
